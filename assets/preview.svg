      <text x="18" y="24" font-size="13" fill="#0f172a" font-weight="700">🎯 Element Inspector — Click-to-Prompt</text>
      <text x="456" y="24" font-size="15" fill="#94a3b8" text-anchor="middle">✕</text>
      <line x1="0" y1="38" x2="476" y2="38" stroke="#e2e8f0" stroke-width="1"/>

      <!-- Component Badge -->
