<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 680" width="100%" height="100%" style="background:#090d16;border-radius:14px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Helvetica,sans-serif;">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="topGlow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#4338ca" stop-opacity="0.38"/>
      <stop offset="45%" stop-color="#1e1b4b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradients -->
    <linearGradient id="btnGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <linearGradient id="errorBtnGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>

    <!-- Layered Shadows -->
    <filter id="windowDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="28" stdDeviation="36" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1080" height="680" fill="#090d16"/>
  <rect width="1080" height="680" fill="url(#topGlow)"/>

  <!-- Blueprint Tech Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <line x1="0" y1="85" x2="1080" y2="85"/>
    <line x1="0" y1="170" x2="1080" y2="170"/>
    <line x1="0" y1="255" x2="1080" y2="255"/>
    <line x1="0" y1="340" x2="1080" y2="340"/>
    <line x1="0" y1="425" x2="1080" y2="425"/>
    <line x1="0" y1="510" x2="1080" y2="510"/>
    <line x1="0" y1="595" x2="1080" y2="595"/>
    <line x1="180" y1="0" x2="180" y2="680"/>
    <line x1="360" y1="0" x2="360" y2="680"/>
    <line x1="540" y1="0" x2="540" y2="680"/>
    <line x1="720" y1="0" x2="720" y2="680"/>
    <line x1="900" y1="0" x2="900" y2="680"/>
  </g>

  <!-- ==================== MAIN IDE WINDOW ==================== -->
  <g filter="url(#windowDropShadow)">
    <rect x="40" y="32" width="1000" height="616" rx="14" fill="#ffffff" stroke="#334155" stroke-opacity="0.45" stroke-width="1"/>

    <!-- Window Title Bar -->
    <path d="M 40 46 Q 40 32 54 32 L 1026 32 Q 1040 32 1040 46 L 1040 72 L 40 72 Z" fill="#f8fafc"/>
    <circle cx="66" cy="52" r="5.5" fill="#ef4444"/>
    <circle cx="84" cy="52" r="5.5" fill="#f59e0b"/>
    <circle cx="102" cy="52" r="5.5" fill="#10b981"/>
    
    <text x="540" y="56" font-size="12" fill="#475569" text-anchor="middle" font-weight="600" letter-spacing="0.2">Antigravity — Aux Pane (Web Browser &amp; Agent Bridge)</text>
    <line x1="40" y1="72" x2="1040" y2="72" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Window Toolbar -->
    <rect x="40" y="72" width="1000" height="48" fill="#ffffff"/>
    <line x1="40" y1="120" x2="1040" y2="120" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Nav Arrows & Controls -->
    <text x="64" y="101" font-size="15" fill="#64748b" font-weight="bold">←</text>
    <text x="90" y="101" font-size="15" fill="#cbd5e1" font-weight="bold">→</text>
    <text x="118" y="101" font-size="15" fill="#64748b">↻</text>
    <text x="144" y="101" font-size="15" fill="#64748b">⌂</text>

    <!-- Address Bar Pill -->
    <rect x="176" y="80" width="490" height="32" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="194" y="101" font-size="12" fill="#10b981">🔒</text>
    <text x="216" y="101" font-size="12.5" fill="#0f172a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="500">http://127.0.0.1:7123/dashboard</text>
    
    <rect x="584" y="86" width="68" height="20" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <text x="618" y="100" font-size="10.5" fill="#059669" text-anchor="middle" font-weight="700">200 OK</text>

    <!-- Mode Badge: Proxy -->
    <rect x="680" y="82" width="80" height="28" rx="6" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
    <text x="720" y="100" font-size="11.5" fill="#7c3aed" text-anchor="middle" font-weight="600">🛡️ Proxy</text>

    <!-- Inspect Button (Active Glowing State) -->
    <rect x="770" y="82" width="90" height="28" rx="6" fill="#7c3aed"/>
    <text x="815" y="100" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="600">🎯 Inspect</text>

    <!-- Error Badge (Active Alert State) -->
    <rect x="870" y="82" width="84" height="28" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="912" y="100" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">🐞 1 Error</text>

    <!-- External Link -->
    <rect x="964" y="82" width="38" height="28" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="983" y="100" font-size="13" fill="#64748b" text-anchor="middle">↗</text>

    <!-- ==================== WEB VIEWPORT AREA ==================== -->
    <rect x="40" y="120" width="1000" height="528" fill="#f8fafc"/>

    <!-- In-App Header & Metrics Bar -->
    <rect x="64" y="136" width="952" height="70" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Metric 1: Total Cells -->
    <g transform="translate(86, 150)">
      <text x="0" y="14" font-size="11" fill="#64748b" font-weight="500">Total Analyzed Cells</text>
      <text x="0" y="40" font-size="22" fill="#0f172a" font-weight="800">3,240</text>
      <rect x="72" y="25" width="52" height="18" rx="4" fill="#ecfdf5"/>
      <text x="98" y="38" font-size="10" fill="#059669" text-anchor="middle" font-weight="700">+12.4%</text>
    </g>
    <line x1="240" y1="150" x2="240" y2="192" stroke="#f1f5f9" stroke-width="1"/>

    <!-- Metric 2: Clustering -->
    <g transform="translate(266, 150)">
      <text x="0" y="14" font-size="11" fill="#64748b" font-weight="500">Clustering Resolution</text>
      <text x="0" y="40" font-size="22" fill="#0f172a" font-weight="800">0.60</text>
      <text x="56" y="38" font-size="11" fill="#64748b" font-weight="500">(8 Subsets)</text>
    </g>
    <line x1="420" y1="150" x2="420" y2="192" stroke="#f1f5f9" stroke-width="1"/>

    <!-- Metric 3: Reactive Connection -->
    <g transform="translate(446, 150)">
      <text x="0" y="14" font-size="11" fill="#64748b" font-weight="500">WebSocket Transport</text>
      <text x="0" y="39" font-size="14" fill="#10b981" font-weight="700">● Connected (Proxy Rewritten)</text>
    </g>

