      <text x="314" y="99" font-size="10" fill="#ffffff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700">cluster#3 (Monocytes)</text>

      <!-- Cluster Legend -->
      <g transform="translate(20, 208)">
        <circle cx="4" cy="4" r="4" fill="#8b5cf6"/>
        <text x="14" y="7" font-size="10" fill="#475569">T cells</text>
        <circle cx="80" cy="4" r="4" fill="#06b6d4"/>
        <text x="90" y="7" font-size="10" fill="#475569">B cells</text>
        <circle cx="150" cy="4" r="4" fill="#10b981"/>
        <text x="160" y="7" font-size="10" fill="#475569">NK cells</text>
        <circle cx="225" cy="4" r="4" fill="#f59e0b"/>
        <text x="235" y="7" font-size="10" fill="#475569">Monocytes</text>
      </g>
    </g>

    <!-- RIGHT TILE: Floating Prompt Modal (Click-to-Prompt) -->
