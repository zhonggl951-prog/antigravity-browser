    <rect x="780" y="154" width="100" height="34" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="830" y="175" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="600">Filters</text>

    <rect x="892" y="154" width="110" height="34" rx="6" fill="#0f172a"/>
    <text x="947" y="175" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="600">Run Pipeline</text>

    <!-- ==================== MAIN CONTENT: 2 POLISHED TILES ==================== -->
    
    <!-- LEFT TILE: Live UMAP Scatter Plot with Selected Component -->
    <g transform="translate(64, 218)">
      <rect width="460" height="236" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="20" y="24" font-size="13" fill="#0f172a" font-weight="700">UMAP Dimension Reduction</text>
      <text x="20" y="40" font-size="10.5" fill="#94a3b8">Leiden clustering algorithm · 50 PCs · n_neighbors=15</text>
      <line x1="0" y1="52" x2="460" y2="52" stroke="#f8fafc" stroke-width="1"/>

      <!-- Organic Scatter Clusters -->
      <g opacity="0.85">
        <!-- Cluster 0: T cells (Purple) -->
        <circle cx="105" cy="115" r="5" fill="#8b5cf6"/>
        <circle cx="120" cy="98" r="5.5" fill="#8b5cf6"/>
        <circle cx="92" cy="130" r="4.5" fill="#8b5cf6"/>
        <circle cx="132" cy="135" r="6" fill="#8b5cf6"/>
        <circle cx="110" cy="150" r="4.5" fill="#8b5cf6"/>
        <circle cx="140" cy="110" r="5" fill="#8b5cf6"/>
        <circle cx="85" cy="105" r="4" fill="#8b5cf6"/>

        <!-- Cluster 1: B cells (Cyan) -->
