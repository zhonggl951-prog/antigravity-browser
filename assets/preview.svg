        <circle cx="250" cy="70" r="6" fill="#06b6d4"/>
        <circle cx="215" cy="100" r="4.5" fill="#06b6d4"/>
        <circle cx="245" cy="115" r="5.5" fill="#06b6d4"/>
        <circle cx="270" cy="90" r="4" fill="#06b6d4"/>

        <!-- Cluster 2: NK cells (Emerald) -->
        <circle cx="180" cy="195" r="5" fill="#10b981"/>
        <circle cx="200" cy="185" r="5.5" fill="#10b981"/>
        <circle cx="170" cy="210" r="4.5" fill="#10b981"/>
        <circle cx="215" cy="205" r="6" fill="#10b981"/>

        <!-- Cluster 3: Monocytes (Amber) — TARGET OF INSPECTION -->
        <circle cx="340" cy="140" r="5.5" fill="#f59e0b"/>
        <circle cx="358" cy="125" r="4.5" fill="#f59e0b"/>
        <circle cx="375" cy="155" r="6" fill="#f59e0b"/>
        <circle cx="330" cy="165" r="5" fill="#f59e0b"/>
        <circle cx="385" cy="135" r="4.5" fill="#f59e0b"/>
