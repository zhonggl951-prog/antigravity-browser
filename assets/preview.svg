      <text x="28" y="65" font-size="11" fill="#7c3aed" font-weight="700">Component:</text>
      <text x="104" y="65" font-size="11" fill="#0f172a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">div#umap-plot &gt; g.cluster-3</text>

      <!-- Prompt Input Box -->
      <rect x="18" y="82" width="440" height="92" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="30" y="105" font-size="12" fill="#0f172a">Filter cells in cluster 3, highlight differential markers</text>
      <text x="30" y="127" font-size="12" fill="#0f172a">(CD14, LYZ), and export publication-ready 600 DPI vector PDF.</text>
      <line x1="410" y1="117" x2="410" y2="131" stroke="#7c3aed" stroke-width="1.5"/>

      <!-- Modal Footer -->
      <circle cx="28" cy="204" r="4" fill="#10b981"/>
      <text x="38" y="208" font-size="11" fill="#64748b">Visual snapshot attached (PNG)</text>

      <rect x="264" y="190" width="64" height="28" rx="5" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
      <text x="296" y="208" font-size="11" fill="#475569" text-anchor="middle" font-weight="600">Cancel</text>

      <rect x="336" y="190" width="124" height="28" rx="5" fill="url(#btnGrad)"/>
      <text x="398" y="208" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Send to Agent 🚀</text>
    </g>

    <!-- ==================== CONSOLE ERRORS DRAWER (v1.2.0 FEATURE) ==================== -->
    <g transform="translate(40, 474)">
      <!-- Drawer Header Bar -->
      <rect width="1000" height="36" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="0" y1="0" x2="1000" y2="0" stroke="#e2e8f0" stroke-width="1.5"/>
      
      <!-- Drawer Title with Badge -->
      <text x="18" y="23" font-size="14">🐞</text>
      <text x="40" y="23" font-size="12.5" fill="#0f172a" font-weight="700">Console Errors</text>
      
      <rect x="136" y="11" width="24" height="16" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
      <text x="148" y="23" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="700">1</text>

      <!-- Drawer Action Buttons -->
      <rect x="710" y="5" width="168" height="26" rx="5" fill="url(#errorBtnGrad)"/>
      <text x="794" y="22" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Send Error to Agent 🚀</text>

      <rect x="888" y="5" width="56" height="26" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="916" y="22" font-size="11" fill="#64748b" text-anchor="middle" font-weight="600">Clear</text>

      <rect x="952" y="5" width="36" height="26" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="970" y="22" font-size="12" fill="#94a3b8" text-anchor="middle">✕</text>

      <!-- Drawer Error Item Content Area -->
      <rect y="36" width="1000" height="138" fill="#ffffff"/>
      <line x1="0" y1="36" x2="1000" y2="36" stroke="#e2e8f0" stroke-width="1"/>

      <!-- Captured Error Entry -->
      <g transform="translate(24, 52)">
        <text x="0" y="14" font-size="12" fill="#dc2626" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
          ❌ Uncaught TypeError: Cannot read properties of undefined (reading 'filter')
        </text>
        <rect x="670" y="2" width="28" height="16" rx="8" fill="#ef4444"/>
        <text x="684" y="14" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="700">x2</text>
        
        <text x="0" y="34" font-size="11" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
          📍 http://127.0.0.1:7123/src/components/GeneTable.tsx:64:18
        </text>

        <!-- Stack Trace Preview Card -->
        <rect x="0" y="44" width="952" height="52" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="14" y="64" font-size="10.5" fill="#475569" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
          at GeneTable.render (http://127.0.0.1:7123/src/components/GeneTable.tsx:64:18)
        </text>
        <text x="14" y="82" font-size="10.5" fill="#94a3b8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
          at commitHookEffectListMount (http://127.0.0.1:7123/node_modules/react-dom/client.js:23150)
        </text>
      </g>
    </g>
  </g>
</svg>
