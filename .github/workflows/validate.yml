name: Validate Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JSON configurations
        run: |
          node -e "JSON.parse(require('fs').readFileSync('plugin.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('sidecars/web_browser/sidecar.json', 'utf8'))"

      - name: Syntax check server and runtime
        run: |
          node --check sidecars/web_browser/server.mjs
          node --check sidecars/web_browser/inspector-runtime.js
